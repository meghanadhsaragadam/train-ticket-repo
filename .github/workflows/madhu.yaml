name: ci/cd pipeline to deploy to nexus artifact
on:
 push:
   branches: master
jobs:
 build-deploy:
  runs-on: ubuntu-latest
  steps:
      - name: checkout code
        uses: actions/checkout@v3
      - name: set-up jdk
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'  
      - name: maven validate
        run: mvn validate 
      - name: maven compile
        run: mvn compile
      - name: maven test
        run: mvn test
      - name: maven package
        run: mvn package 
        name: CI - SonarQube Only

on:
  push:
    branches: [dev, test, pre-prod, main]

  workflow_dispatch:

jobs:
  sonar-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build project
        run: mvn -B clean verify

      - name: Run SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.projectKey=myapp \
            -Dsonar.projectName="MyApp" \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
    
      
      

        
      
 
